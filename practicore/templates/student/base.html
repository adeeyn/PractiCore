<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PractiCore{% endblock %}</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='student/style.css') }}?v=4">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="app-shell">
        <!-- MAROON SIDEBAR (off-canvas drawer, opened via the burger button) -->
        <aside class="sidebar" id="app-sidebar">
            <div class="sidebar-brand">
                <img class="brand-cap-icon" src="{{ url_for('static', filename='img/logo-icon.png') }}" alt="">
                <span>PractiCore</span>
                <button type="button" class="sidebar-close" id="sidebar-close"
                        aria-label="Close navigation" aria-controls="app-sidebar">
                    <i data-lucide="x"></i>
                </button>
            </div>

            <nav class="nav">
                <a href="{{ url_for('student.dashboard') }}" class="nav-item {% if active_page | default('dashboard') == 'dashboard' %}active{% endif %}">
                    <i data-lucide="layout-grid"></i>
                    <span>Dashboard</span>
                </a>
                <a href="{{ url_for('student.profile') }}" class="nav-item {% if active_page | default('dashboard') == 'profile' %}active{% endif %}">
                    <i data-lucide="user"></i>
                    <span>Profile</span>
                </a>
                <a href="{{ url_for('student.resume') }}" class="nav-item {% if active_page | default('dashboard') in ['resume', 'upload_resume'] %}active{% endif %}">
                    <i data-lucide="file-text"></i>
                    <span>Resume</span>
                </a>
                <a href="{{ url_for('student.assessment') }}" class="nav-item {% if active_page | default('dashboard') in ['assessment', 'start_assessment', 'assessment_results'] %}active{% endif %}">
                    <i data-lucide="award"></i>
                    <span>Skill Assessment</span>
                </a>
                <a href="{{ url_for('student.recommendation') }}" class="nav-item {% if active_page | default('dashboard') == 'recommendation' %}active{% endif %}">
                    <i data-lucide="search"></i>
                    <span>Internship Opportunities</span>
                </a>
                <a href="{{ url_for('student.application') }}" class="nav-item {% if active_page | default('dashboard') == 'application' %}active{% endif %}">
                    <i data-lucide="briefcase"></i>
                    <span>Applications</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-slogan">
                    Elevate your skills.<br>
                    Build your future.
                </div>
                <div class="logout">
                    <a href="{{ url_for('auth.logout') }}">
                        <i data-lucide="log-out"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
        </aside>

        <!-- Dimmed backdrop shown while the sidebar drawer is open -->
        <div class="sidebar-overlay" id="sidebar-overlay" hidden></div>

        <!-- DYNAMIC MAIN CONTENT AREA -->
        <main class="main">
            {% include "student/_header.html" %}

            <div class="content-body">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='student/main.js') }}"></script>
    <script>
        if (window.lucide) {
            lucide.createIcons();
        }

        // Burger menu: slide the maroon sidebar drawer in over a dimmed
        // backdrop. Closed via the dimmed area, the x button, or Escape.
        (function () {
            var toggleBtn = document.getElementById('sidebar-toggle');
            var closeBtn = document.getElementById('sidebar-close');
            var sidebar = document.getElementById('app-sidebar');
            var overlay = document.getElementById('sidebar-overlay');

            function setOpen(open) {
                if (!sidebar) {
                    return;
                }
                sidebar.classList.toggle('open', open);
                if (overlay) {
                    overlay.hidden = !open;
                }
                if (toggleBtn) {
                    toggleBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
                }
                if (open && closeBtn) {
                    closeBtn.focus();
                }
            }

            if (toggleBtn && sidebar) {
                toggleBtn.addEventListener('click', function () {
                    setOpen(!sidebar.classList.contains('open'));
                });
            }
            if (closeBtn) {
                closeBtn.addEventListener('click', function () {
                    setOpen(false);
                });
            }
            if (overlay) {
                overlay.addEventListener('click', function () {
                    setOpen(false);
                });
            }
            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape') {
                    setOpen(false);
                }
            });
        })();

        // A logged-out page can still be restored from the browser cache on Back,
        // so re-check the session and send the user to login if it has gone.
        window.addEventListener('pageshow', function (event) {
            if (!event.persisted) {
                return;
            }

            fetch('/', { method: 'HEAD', cache: 'no-store' })
                .then(function (response) {
                    const target = new URL(response.url, window.location.origin);

                    if (target.pathname === '/login') {
                        window.location.replace(target.href);
                    }
                })
                .catch(function () {
                    // Offline or blocked: leave the page as it is
                });
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
