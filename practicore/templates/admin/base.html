<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PractiCore Admin{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin/css/layout.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="admin-nav">
        <span class="admin-brand">✦ PractiCore Admin</span>
        <nav>
            <a href="{{ url_for('admin.dashboard') }}" class="{% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
            <a href="{{ url_for('admin.create_employer') }}" class="{% if active_page == 'employers' %}active{% endif %}">New Employer Account</a>
            <a href="{{ url_for('auth.logout') }}">Logout</a>
        </nav>
    </header>
    <main class="admin-content">
        {% block content %}{% endblock %}
    </main>

    <script>
        // A logged-out page can still be restored from the browser cache on Back,
        // so re-check the session and send the user to login if it has gone.
        window.addEventListener('pageshow', function (event) {
            if (!event.persisted) {
                return;
            }

            fetch('/', { method: 'HEAD', cache: 'no-store' })
                .then(function (response) {
                    const target = new URL(response.url, window.location.origin);

                    if (target.pathname === '/login') {
                        window.location.replace(target.href);
                    }
                })
                .catch(function () {
                    // Offline or blocked: leave the page as it is
                });
        });
    </script>
</body>
</html>
