<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Employer Portal — PractiCore{% endblock %}</title>
    
    <!-- Standard Flask static routes -->
    <link rel="stylesheet" href="{{ url_for('emplyoer.static', filename='employer/variable.css') }}">
    <link rel="stylesheet" href="{{ url_for('emplyoer.static', filename='employer/layout.css') }}">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <div class="emp-app-shell">
        
        <!-- DISTINCT EMPLOYER SIDEBAR -->
        <aside class="emp-sidebar">
            <div class="emp-sidebar-brand">
                PractiCore <span>Partner</span>
            </div>
            
            <div class="emp-profile-mini">
                <div class="emp-avatar">TS</div>
                <div>
                    <strong>TechSolution Inc.</strong>
                    <span>Employer Partner</span>
                </div>
            </div>

            <nav class="emp-nav">
                <a href="{{ url_for('employer.employer_dashboard') }}" class="{% if active_page | default('dashboard') == 'dashboard' %}active{% endif %}">
                    <span class="emp-nav-icon">📊</span>
                    <span>Overview</span>
                </a>
                <a href="#" class="{% if active_page | default('dashboard') == 'company' %}active{% endif %}">
                    <span class="emp-nav-icon">🏢</span>
                    <span>Company Profile</span>
                </a>
                <a href="#" class="{% if active_page | default('dashboard') == 'postings' %}active{% endif %}">
                    <span class="emp-nav-icon">📝</span>
                    <span>Internship Postings</span>
                </a>
                <a href="#" class="{% if active_page | default('dashboard') == 'ranking' %}active{% endif %}">
                    <span class="emp-nav-icon">⭐</span>
                    <span>Candidate Ranking</span>
                </a>
                <a href="#" class="{% if active_page | default('dashboard') == 'messages' %}active{% endif %}">
                    <span class="emp-nav-icon">💬</span>
                    <span>Messages</span>
                </a>
                <a href="#" class="{% if active_page | default('dashboard') == 'settings' %}active{% endif %}">
                    <span class="emp-nav-icon">⚙</span>
                    <span>Settings</span>
                </a>
            </nav>

            <div class="emp-logout">
                <a href="{{ url_for('logout') }}">
                    <span class="emp-nav-icon">➔</span>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- MAIN VIEWPORT -->
        <main class="emp-main">
            {% block content %}{% endblock %}
        </main>

    </div>

    <script>
        if (typeof lucide !== 'undefined') {
            lucide.createIcons();
        }
    </script>
</body>
</html>
